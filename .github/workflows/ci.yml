name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Ejecutar pruebas
        run: echo "Pruebas ejecutadas con exito"

      - name: Generar Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: proyecto-completo
          path: .
